<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { motion, AnimatePresence } = window.Motion;

    // --- MOCK BACKEND (IndexedDB + Fetch Interceptor) ---
    // Simulates the Python Flask + SQLite Backend entirely in the browser
    const initMockBackend = () => {
        const DB_NAME = 'CampusFlowDB';
        const STORE_NAME = 'fee_queue';
        const MAX_CAPACITY = 50;
        const AVG_WAIT_TIME = 3;

        const openDB = () => new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                }
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });

        const runTx = async (mode, callback) => {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, mode);
                const store = tx.objectStore(STORE_NAME);
                const req = callback(store);
                if (req) {
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                } else {
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                }
            });
        };

        const getAll = () => runTx('readonly', store => store.getAll());
        
        const originalFetch = window.fetch;
        window.fetch = async (input, init) => {
            const url = typeof input === 'string' ? input : input.url;
            if (!url.startsWith('/api/fees')) return originalFetch(input, init);

            const method = init?.method || 'GET';
            const body = init?.body ? JSON.parse(init.body) : null;
            await new Promise(res => setTimeout(res, 400)); // Network delay simulation

            const respond = (data, status = 200) => new Response(JSON.stringify(data), { status, headers: { 'Content-Type': 'application/json' } });

            try {
                const allTokens = await getAll();
                const waiting = allTokens.filter(t => t.status === 'WAITING').sort((a,b)=>a.id-b.id);
                const serving = allTokens.filter(t => t.status === 'SERVING').sort((a,b)=>a.id-b.id);
                const current_queue = waiting.length + serving.length;

                if (url === '/api/fees/availability' && method === 'GET') {
                    let next_avail = null;
                    if (current_queue >= MAX_CAPACITY) {
                        const d = new Date(Date.now() + AVG_WAIT_TIME * 60000);
                        next_avail = d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    }
                    return respond({
                        max_capacity: MAX_CAPACITY,
                        current_queue,
                        available: MAX_CAPACITY - current_queue,
                        serving: serving.length > 0 ? serving[0].token_number : null,
                        next_availability_time: next_avail,
                        people_waiting: waiting.length
                    });
                }

                if (url === '/api/fees/apply' && method === 'POST') {
                    if (current_queue >= MAX_CAPACITY) return respond({ error: "QUEUE FULL", message: "All tokens are currently occupied." }, 400);
                    const lastNum = allTokens.length > 0 ? Math.max(...allTokens.map(t => parseInt(t.token_number.split('-')[1]))) : 0;
                    const token_str = `FQ-${String(lastNum + 1).padStart(3, '0')}`;
                    
                    const newToken = { token_number: token_str, ...body, request_time: new Date().toISOString(), status: 'WAITING' };
                    await runTx('readwrite', store => store.add(newToken));
                    
                    const queue_position = waiting.length + 1;
                    return respond({ ...newToken, queue_position, estimated_wait: queue_position * AVG_WAIT_TIME });
                }

                if (url === '/api/fees/queue' && method === 'GET') {
                    return respond({ serving: serving.length > 0 ? serving[0] : null, waiting: waiting });
                }

                if (url.startsWith('/api/fees/status/') && method === 'GET') {
                    const tokenNum = url.split('/').pop();
                    const token = allTokens.find(t => t.token_number === tokenNum);
                    if (!token) return respond({ error: 'Not found' }, 404);
                    let q_pos = 0, e_wait = 0;
                    if (token.status === 'WAITING') {
                        q_pos = waiting.findIndex(t => t.id === token.id) + 1;
                        e_wait = q_pos * AVG_WAIT_TIME;
                    }
                    return respond({ ...token, queue_position: q_pos, estimated_wait: e_wait });
                }

                if (url === '/api/fees/next' && method === 'POST') {
                    await runTx('readwrite', store => {
                        if (serving.length > 0) store.put({ ...serving[0], status: 'COMPLETED' });
                        if (waiting.length > 0) store.put({ ...waiting[0], status: 'SERVING' });
                    });
                    return respond({ success: true });
                }

                if (url === '/api/fees/complete' && method === 'POST') {
                    await runTx('readwrite', store => {
                        if (serving.length > 0) store.put({ ...serving[0], status: 'COMPLETED' });
                    });
                    return respond({ success: true });
                }

                if (url === '/api/fees/cancel' && method === 'POST') {
                    const token = allTokens.find(t => t.token_number === body.token_number);
                    if (token) await runTx('readwrite', store => store.put({ ...token, status: 'CANCELLED' }));
                    return respond({ success: true });
                }

                return respond({ error: 'Not found' }, 404);
            } catch (err) {
                console.error(err);
                return respond({ error: 'Internal Server Error' }, 500);
            }
        };
    };
    initMockBackend();

    // --- GLOBAL SETUP (Simulating Backend Data) ---
    const initGlobalData = () => {
        // 1. Initialize Staff (90 members across 9 departments)
        if (!localStorage.getItem('cf_staff')) {
            const depts = ['CSE', 'IT', 'ECE', 'EEE', 'MECH', 'CIVIL', 'VLSI', 'MBA', 'MCA'];
            const firstNames = ["Arun", "Priya", "Rahul", "Anitha", "Suresh", "Kavitha", "Vijay", "Deepa", "Karthik", "Sneha", "Manoj", "Divya", "Sanjay", "Meera", "Ravi"];
            const lastNames = ["Kumar", "Sharma", "Singh", "Raj", "Menon", "Nair", "Iyer", "Rao", "Das", "Patil", "Reddy", "Pillai", "Verma", "Jain", "Bose"];
            
            const staffList = [];
            let idCounter = 1;

            depts.forEach(dept => {
                const usedNames = new Set();
                while(usedNames.size < 10) {
                    const fName = firstNames[Math.floor(Math.random() * firstNames.length)];
                    const lName = lastNames[Math.floor(Math.random() * lastNames.length)];
                    const fullName = `Dr. ${fName} ${lName}`;
                    if(!usedNames.has(fullName)) {
                        usedNames.add(fullName);
                        const isFaculty001 = (dept === 'IT' && usedNames.size === 1); // Ensure faculty001 has an entry
                        const staffId = isFaculty001 ? 'faculty001' : `${dept}${String(idCounter).padStart(3, '0')}`;
                        const name = isFaculty001 ? 'Dr. Anitha Kumar' : fullName;
                        
                        staffList.push({
                            id: staffId,
                            name: name,
                            department: dept,
                            designation: 'Assistant Professor',
                            room: `Room ${dept}-${100 + usedNames.size}`,
                            status: 'AVAILABLE' // AVAILABLE, BUSY, EXAM-HALL DUTY, LEAVE, HALF-DAY PERMISSION
                        });
                        idCounter++;
                    }
                }
            });
            localStorage.setItem('cf_staff', JSON.stringify(staffList));
        }

        // 2. Initialize Fee Slots
        if (!localStorage.getItem('cf_fee_slots')) {
            const slots = [];
            let hour = 10;
            let min = 0;
            for(let i=0; i<12; i++) {
                const startStr = `${hour > 12 ? hour - 12 : hour}:${min === 0 ? '00' : min} ${hour >= 12 ? 'PM' : 'AM'}`;
                min += 15;
                if(min >= 60) { hour += 1; min = 0; }
                const endStr = `${hour > 12 ? hour - 12 : hour}:${min === 0 ? '00' : min} ${hour >= 12 ? 'PM' : 'AM'}`;
                
                slots.push({
                    id: `slot-${i}`,
                    date: '08 October 2026',
                    time: `${startStr} – ${endStr}`,
                    status: 'AVAILABLE', // AVAILABLE, BOOKED, ACCEPTED, COMPLETED
                    studentId: null,
                    studentName: null,
                    department: null,
                    token: null
                });
            }
            localStorage.setItem('cf_fee_slots', JSON.stringify(slots));
        }

        // 3. Initialize Activity Log
        if (!localStorage.getItem('cf_activity')) {
            localStorage.setItem('cf_activity', JSON.stringify([
                { id: 1, text: "System initialized successfully.", time: new Date().toISOString() }
            ]));
        }
    };
    initGlobalData();

    // --- ICONS ---
    const Icons = {
      Home: () => <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>,
      Clock: () => <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>,
      Users: () => <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>,
      CheckSquare: () => <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>,
      Bell: () => <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" className="w-5 h-5 text-black"><path strokeLinecap="round" strokeLinejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>,
      Search: () => <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>,

                                             <div className={`max-w-[80%] rounded-2xl px-3 py-2 text-sm font-medium ${message.sender === 'user' ? 'bg-indigo-500 text-white' : 'bg-white text-slate-700 border border-slate-200'}`}>
                                                 {message.text}

                                 </div>
                                 <div className="flex items-center gap-3 border-t border-slate-200 bg-white p-3">
                                     <input value={chatInput} onChange={(e) => setChatInput(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') sendChatMessage(); }} placeholder="Type your question..." className="flex-1 bg-slate-100 border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold text-slate-700 placeholder:text-slate-400 outline-none focus:border-indigo-500" />
                                     <button onClick={sendChatMessage} className="bg-indigo-500 text-white px-4 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-indigo-600 transition-all">Send</button>
                                 </div>
                             </motion.div>
                         </motion.div>
                     )}
                 </AnimatePresence>
          </>
       );
    };

    const ModuleCard = ({ title, desc, icon, gradient, btnGradient, dynamicValue, stats, onClick, variants }) => {
        // Map gradient prop to an accent color class
        const accentClass = gradient.includes('FFECE5') ? 'bg-gradient-to-r from-orange-400 to-rose-400' :
                            gradient.includes('EEF2FF') ? 'bg-gradient-to-r from-indigo-400 to-blue-500' :

           <div className={`absolute top-0 left-0 w-full h-1.5 ${accentClass}`}></div>

              <div className="flex justify-between items-start mb-6">
                 <div className="w-14 h-14 bg-slate-50 rounded-2xl border border-slate-100 flex items-center justify-center text-slate-700 shadow-sm">{icon}</div>
                 {dynamicValue && <span className={`text-[10px] font-black uppercase tracking-widest px-3 py-1.5 rounded-lg border shadow-sm ${dynamicValue==='FULL'?'bg-rose-50 border-rose-100 text-rose-600':'bg-emerald-50 border-emerald-100 text-emerald-600'}`}>Status: {dynamicValue}</span>}

                    {stats.map((s, i) => (

                          <span className="text-sm font-black text-slate-700">{s.value}</span>

              )}
              <button className={`mt-auto self-start flex items-center gap-2 px-6 py-3 rounded-xl bg-gradient-to-r ${btnGradient} text-white font-black uppercase tracking-widest text-xs shadow-md group-hover:shadow-lg transition-all outline-none`}>Open <Icons.ArrowRight /></button>
           </div>
        </motion.div>
    )};

    // --- FULLY FUNCTIONAL FEES QUEUE SYSTEM ---
    const FeesQueueSystem = ({ queueData, auth }) => {
        const isFaculty = auth?.role === 'faculty' || auth?.role === 'admin';
        const [slots, setSlots] = useState(() => JSON.parse(localStorage.getItem('cf_fee_slots')) || []);
        const [myBooking, setMyBooking] = useState(null);
        const [view, setView] = useState(isFaculty ? 'faculty_list' : 'pending_fees');

        useEffect(() => {
            if (!isFaculty) {
                const mySlots = slots.filter(s => s.studentId === auth?.username);
                const activeBooking = mySlots.find(s => s.status !== 'CANCELLED');
                const booking = activeBooking || mySlots.find(s => s.status === 'CANCELLED');
                
                setMyBooking(booking || null);
                
                if (activeBooking && view !== 'timeline' && view !== 'book_slot') {
                    setView('timeline');
                }
            }
        }, [slots, isFaculty, auth?.username, view]);

        const pushNotif = (notif) => {
            const allNotifs = JSON.parse(localStorage.getItem('cf_notifications') || '[]');
            const msg = notif.message.toLowerCase();
            const category = notif.category || (msg.includes('fee') || msg.includes('token') ? 'fees' : msg.includes('od ') ? 'od' : 'system');
            allNotifs.unshift({ ...notif, id: Date.now().toString() + Math.random().toString(36).substr(2, 5), category, time: new Date().toISOString(), read: false });
            localStorage.setItem('cf_notifications', JSON.stringify(allNotifs));
            window.dispatchEvent(new Event('cf_notify'));
        };

        const handleCancelToken = (slotId) => {
            if (!window.confirm("Are you sure you want to cancel this fee payment token?")) return;
            
            const slotToCancel = slots.find(s => s.id === slotId);
            if (!slotToCancel || slotToCancel.status === 'COMPLETED') return;

            const cancelledRecord = { ...slotToCancel, id: 'canc-' + Date.now(), status: 'CANCELLED', isHistory: true };
            
            const updated = slots.map(s => {
                if (s.id === slotId) {
                    return { ...s, status: 'AVAILABLE', studentId: null, studentName: null, department: null, token: null };
                }
                return s;
            });
            updated.push(cancelledRecord);

            localStorage.setItem('cf_fee_slots', JSON.stringify(updated));
            setSlots(updated);
            
            const acts = JSON.parse(localStorage.getItem('cf_activity')||'[]');
            acts.unshift({ id: Date.now(), text: `Token ${slotToCancel.token} cancelled`, time: new Date().toISOString() });
            localStorage.setItem('cf_activity', JSON.stringify(acts));

            pushNotif({
                targetRole: 'faculty',
                message: `Fee token ${slotToCancel.token} was cancelled by ${auth?.name}.`,
                details: `Slot Time: ${slotToCancel.time} is now available.`
            });
        };

        const handleBookSlot = (slot) => {
            const hasActive = slots.find(s => s.studentId === auth?.username && s.status !== 'CANCELLED');
            
            if (hasActive) {
                if (hasActive.status === 'COMPLETED' || hasActive.status === 'ACCEPTED') {
                    alert("You cannot change a token that has already been accepted or completed.");
                    return;
                }
                if (!window.confirm(`You already have a token for ${hasActive.time}. Do you want to cancel it and book ${slot.time} instead?`)) return;
            } else {
                if (!window.confirm(`Confirm booking for ${slot.time}?`)) return;
            }

            const tokenNum = `FQ-${Math.floor(Math.random()*100).toString().padStart(3,'0')}`;
            const updated = slots.map(s => {
                if (hasActive && s.id === hasActive.id) {
                    return { ...s, status: 'AVAILABLE', studentId: null, studentName: null, department: null, token: null };
                }
                if (s.id === slot.id) {
                    return { ...s, status: 'BOOKED', studentId: auth?.username, studentName: auth?.name, department: 'IT', token: tokenNum };
                }
                return s;
            });
            
            if (hasActive) {
                updated.push({ ...hasActive, id: 'canc-' + Date.now(), status: 'CANCELLED', isHistory: true });
                const acts = JSON.parse(localStorage.getItem('cf_activity')||'[]');
                acts.unshift({ id: Date.now(), text: `Token ${hasActive.token} cancelled, re-booked to ${slot.time}`, time: new Date().toISOString() });
                localStorage.setItem('cf_activity', JSON.stringify(acts));
            } else {
                const acts = JSON.parse(localStorage.getItem('cf_activity')||'[]');
                acts.unshift({ id: Date.now(), text: `Fee slot ${slot.time} booked by ${auth?.name}`, time: new Date().toISOString() });
                localStorage.setItem('cf_activity', JSON.stringify(acts));
            }

            localStorage.setItem('cf_fee_slots', JSON.stringify(updated));
            setSlots(updated);
            setView('timeline');
            
            pushNotif({
                targetRole: 'faculty',
                message: `Student ${auth?.name} (${auth?.username}) booked a new fee slot.`,
                details: `New Token: ${tokenNum} | Time: ${slot.time}`
            });
        };

        const handleAcceptToken = (slot) => {
            const updated = slots.map(s => s.id === slot.id ? { ...s, status: 'ACCEPTED' } : s);
            localStorage.setItem('cf_fee_slots', JSON.stringify(updated));
            setSlots(updated);

            const acts = JSON.parse(localStorage.getItem('cf_activity')||'[]');
            acts.unshift({ id: Date.now(), text: `Student ${slot.token} token accepted by Student Affairs`, time: new Date().toISOString() });
            localStorage.setItem('cf_activity', JSON.stringify(acts));

            pushNotif({
                targetUsername: slot.studentId,
                message: `Your fee payment token ${slot.token} has been accepted. Please proceed to the Admission Office.`,
                details: `Slot Time: ${slot.time}`
            });
        };

        const renderPendingFees = () => (
            <motion.div initial={{opacity:0}} animate={{opacity:1}} className="max-w-2xl mx-auto space-y-6">
                <div className="bg-white rounded-3xl p-8 shadow-sm border border-slate-100 relative overflow-hidden">

                    <div className="space-y-4 mb-8 relative z-10">
                        <div className="flex justify-between border-b border-slate-100 pb-3"><span className="text-sm font-bold text-slate-500 uppercase tracking-widest">Student Name</span><span className="text-sm font-black text-slate-800">{auth?.name || 'Student'}</span></div>
                        <div className="flex justify-between border-b border-slate-100 pb-3"><span className="text-sm font-bold text-slate-500 uppercase tracking-widest">Student ID</span><span className="text-sm font-black text-slate-800">{auth?.username || 'ID'}</span></div>
                        <div className="flex justify-between border-b border-slate-100 pb-3"><span className="text-sm font-bold text-slate-500 uppercase tracking-widest">Department</span><span className="text-sm font-black text-slate-800">Information Technology</span></div>
                        <div className="flex justify-between border-b border-slate-100 pb-3"><span className="text-sm font-bold text-slate-500 uppercase tracking-widest">Academic Year</span><span className="text-sm font-black text-slate-800">2026-2027</span></div>
                        <div className="flex justify-between border-b border-slate-100 pb-3"><span className="text-sm font-bold text-slate-500 uppercase tracking-widest">Fee Type</span><span className="text-sm font-black text-slate-800">Tuition Fee</span></div>
                        <div className="flex justify-between border-b border-slate-100 pb-3"><span className="text-sm font-bold text-slate-500 uppercase tracking-widest">Total Fee</span><span className="text-sm font-black text-slate-800">₹50,000</span></div>
                        <div className="flex justify-between border-b border-slate-100 pb-3"><span className="text-sm font-bold text-slate-500 uppercase tracking-widest">Paid Amount</span><span className="text-sm font-black text-emerald-600">₹35,000</span></div>
                        <div className="flex justify-between border-b border-slate-100 pb-3"><span className="text-sm font-bold text-slate-500 uppercase tracking-widest">Pending Amount</span><span className="text-sm font-black text-rose-600">₹15,000</span></div>
                        <div className="flex justify-between border-b border-slate-100 pb-3"><span className="text-sm font-bold text-slate-500 uppercase tracking-widest">Due Date</span><span className="text-sm font-black text-slate-800">15 Nov 2026</span></div>
                        <div className="flex justify-between border-b border-slate-100 pb-3"><span className="text-sm font-bold text-slate-500 uppercase tracking-widest">Status</span><span className="text-[10px] font-black bg-rose-100 text-rose-600 px-3 py-1 rounded-full">PENDING</span></div>
                    </div>

                    <button onClick={()=>setView('book_slot')} className="w-full py-4 bg-blue-600 text-white rounded-xl font-black uppercase tracking-widest shadow-[0_8px_20px_rgba(37,99,235,0.3)] hover:-translate-y-0.5 transition-all outline-none">
                        BOOK PAYMENT SLOT
                    </button>
                </div>
            </motion.div>
        );

        const renderBookSlot = () => (
            <motion.div initial={{opacity:0}} animate={{opacity:1}} className="max-w-4xl mx-auto space-y-6">
                <button onClick={()=>setView('pending_fees')} className="text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-slate-600 flex items-center gap-2 mb-4">← BACK TO FEES</button>
                <div className="bg-white rounded-3xl p-8 shadow-sm border border-slate-100 relative overflow-hidden">
                    <h3 className="text-xl font-black text-slate-800 tracking-tight mb-2">Book Fee Payment Slot</h3>
                    <p className="text-sm font-bold text-slate-500 mb-8">Select an available time slot for 08 October 2026</p>
                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                        {slots.map(s => (
                            <div key={s.id} className={`p-4 rounded-2xl border-2 transition-all ${s.status === 'AVAILABLE' ? 'border-slate-200 hover:border-blue-500 cursor-pointer bg-white' : 'border-slate-100 bg-slate-50 opacity-60'}`} onClick={() => s.status==='AVAILABLE' && handleBookSlot(s)}>
                                <p className="text-sm font-black text-slate-700 mb-2">{s.time}</p>
                                <span className={`text-[10px] font-black uppercase tracking-widest px-2 py-1 rounded-lg ${s.status === 'AVAILABLE' ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-200 text-slate-500'}`}>{s.status}</span>
                            </div>
                        ))}
                    </div>
                </div>
            </motion.div>
        );

        const renderTimeline = () => {
            if (!myBooking) return null;
            const steps = myBooking.status === 'CANCELLED' ? [
                { label: 'Slot Selected', active: true },
                { label: 'Token Cancelled', active: true }
            ] : [
                { label: 'Slot Selected', active: true },
                { label: 'Slot Booked', active: true },
                { label: 'Waiting for Student Affairs', active: myBooking.status !== 'BOOKED' },
                { label: 'Token Accepted', active: myBooking.status === 'ACCEPTED' || myBooking.status === 'COMPLETED' },
                { label: 'Proceed to Admission Office', active: myBooking.status === 'ACCEPTED' || myBooking.status === 'COMPLETED' },
                { label: 'Payment Completed', active: myBooking.status === 'COMPLETED' }
            ];
            
            return (
                <motion.div initial={{opacity:0}} animate={{opacity:1}} className="max-w-2xl mx-auto space-y-6">
                    <div className="bg-white rounded-3xl p-8 shadow-sm border border-slate-100 relative overflow-hidden text-center">
                        <div className={`w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl shadow-sm ${myBooking.status === 'CANCELLED' ? 'bg-rose-100 text-rose-500' : 'bg-emerald-100 text-emerald-500'}`}>
                            {myBooking.status === 'CANCELLED' ? '\u2715' : '\u2713'}
                        </div>
                        <h3 className="text-2xl font-black text-slate-800 tracking-tight mb-2">
                            {myBooking.status === 'CANCELLED' ? 'SLOT CANCELLED' : 'SLOT BOOKED'}
                        </h3>
                        <div className="inline-block bg-slate-50 border border-slate-100 px-8 py-4 rounded-3xl mb-8 shadow-sm">
                            <p className="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-1">Token Number</p>
                            <p className="text-3xl font-mono font-black text-blue-600">{myBooking.token}</p>
                        </div>
                        <div className="grid grid-cols-2 gap-4 text-left max-w-sm mx-auto mb-10 bg-slate-50 border border-slate-100 p-6 rounded-3xl">
                            <div><p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Date</p><p className="text-sm font-black text-slate-700">{myBooking.date}</p></div>
                            <div><p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Time</p><p className="text-sm font-black text-slate-700">{myBooking.time}</p></div>
                            <div className="col-span-2 pt-2"><p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Status</p><p className={`text-sm font-black uppercase ${myBooking.status === 'CANCELLED' ? 'text-rose-600' : 'text-blue-600'}`}>{myBooking.status === 'BOOKED' ? 'WAITING FOR CONFIRMATION' : myBooking.status}</p></div>
                        </div>

                        <div className="text-left max-w-sm mx-auto relative pl-8 border-l-2 border-slate-100 space-y-8 mb-10">
                            {steps.map((step, idx) => (
                                <div key={idx} className="relative">
                                    <div className={`absolute -left-[41px] w-5 h-5 rounded-full border-[5px] border-white shadow-sm ${step.active ? (myBooking.status === 'CANCELLED' ? 'bg-rose-500' : 'bg-emerald-500') : 'bg-slate-200'}`}></div>
                                    <p className={`text-sm font-black tracking-wide ${step.active ? 'text-slate-800' : 'text-slate-400'}`}>{step.label}</p>
                                </div>
                            ))}
                        </div>

                        {myBooking.status !== 'COMPLETED' && myBooking.status !== 'CANCELLED' && (
                            <div className="flex flex-col sm:flex-row gap-4 justify-center items-center pt-8 border-t border-slate-100">
                                <button onClick={() => handleCancelToken(myBooking.id)} className="px-6 py-3 rounded-xl border-2 border-rose-100 text-rose-500 hover:bg-rose-50 hover:border-rose-200 text-[10px] font-black uppercase tracking-widest transition-all w-full sm:w-auto">
                                    CANCEL TOKEN
                                </button>
                                <button onClick={() => setView('book_slot')} className="px-6 py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white shadow-[0_4px_12px_rgba(37,99,235,0.2)] text-[10px] font-black uppercase tracking-widest transition-all w-full sm:w-auto">
                                    CHOOSE ANOTHER SLOT
                                </button>
                            </div>
                        )}
                        {myBooking.status === 'CANCELLED' && (
                            <div className="pt-8 border-t border-slate-100">
                                <p className="text-sm font-bold text-rose-500 mb-4">This token has been cancelled.</p>
                                <button onClick={() => setView('book_slot')} className="px-6 py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white shadow-[0_4px_12px_rgba(37,99,235,0.2)] text-[10px] font-black uppercase tracking-widest transition-all inline-block">
                                    BOOK NEW SLOT
                                </button>
                            </div>
                        )}
                    </div>
                </motion.div>
            );
        };

        const renderFacultyList = () => {
            const activeSlots = slots.filter(s => !s.isHistory);
            return (
                <motion.div initial={{opacity:0}} animate={{opacity:1}} className="max-w-[1200px] mx-auto space-y-6">
                    <div className="flex justify-between items-end mb-4">
                        <div>
                            <h2 className="text-2xl font-black text-slate-800 tracking-tight">Student Affairs</h2>
                            <p className="text-sm font-bold text-slate-500 mt-1">Manage today's fee payment tokens</p>
                        </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100"><p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Total Slots</p><p className="text-3xl font-black text-slate-800">{activeSlots.length}</p></div>
                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100"><p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Booked</p><p className="text-3xl font-black text-blue-600">{activeSlots.filter(s=>s.status==='BOOKED').length}</p></div>
                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100"><p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Yet to Book</p><p className="text-3xl font-black text-slate-800">{activeSlots.filter(s=>s.status==='AVAILABLE').length}</p></div>
                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100"><p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Accepted</p><p className="text-3xl font-black text-emerald-600">{activeSlots.filter(s=>s.status==='ACCEPTED').length}</p></div>
                    </div>

                    <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                        <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                            <h3 className="text-lg font-black text-slate-800">Today's Fee Tokens</h3>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left">
                                <thead>
                                    <tr className="bg-slate-50 border-b border-slate-100">
                                        <th className="py-4 px-6 text-[10px] font-black uppercase tracking-widest text-slate-400">Token</th>
                                        <th className="py-4 px-6 text-[10px] font-black uppercase tracking-widest text-slate-400">Student Name</th>
                                        <th className="py-4 px-6 text-[10px] font-black uppercase tracking-widest text-slate-400">Department</th>

                clearTimeout(warningTimeout);
                
                // 30 min = 1800000 ms, 29 min = 1740000 ms
                warningTimeout = setTimeout(() => {
                    setShowWarning(true);
                }, 1740000);

                timeout = setTimeout(() => {
                    handleLogout();
                    alert("Your session has expired. Please login again.");
                }, 1800000);
            };

            window.addEventListener('mousemove', resetTimers);
            window.addEventListener('keydown', resetTimers);
            window.addEventListener('click', resetTimers);
            window.addEventListener('scroll', resetTimers);
            resetTimers();

            return () => {
                window.removeEventListener('mousemove', resetTimers);
                window.removeEventListener('keydown', resetTimers);
                window.removeEventListener('click', resetTimers);
                window.removeEventListener('scroll', resetTimers);
                clearTimeout(timeout);
                clearTimeout(warningTimeout);
            };
        }, [auth]);

        const handleLogin = (data) => {
            // Active session ALWAYS goes to sessionStorage (never bypass login permanently)
            sessionStorage.removeItem('cf_auth');
            const authObj = { isLoggedIn: true, role: data.role, username: data.username, name: data.name };
            sessionStorage.setItem('cf_auth', JSON.stringify(authObj));
            setAuth(authObj);
        };

        const handleLogout = () => {
            sessionStorage.removeItem('cf_auth');
            setAuth(null);
            setShowWarning(false);
        };

        if (!auth) {
            return <LoginPage onLogin={handleLogin} />;
        }

        return (
            <>
                <DashboardLayout auth={auth} onLogout={handleLogout} />
                <AnimatePresence>
                    {showWarning && (
                        <div className="fixed inset-0 z-[999] flex items-center justify-center p-4">
                            <motion.div initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}} className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm"></motion.div>
                            <motion.div initial={{scale:0.9, opacity:0}} animate={{scale:1, opacity:1}} exit={{scale:0.9, opacity:0}} className="relative bg-white rounded-3xl shadow-2xl p-8 max-w-sm w-full z-10 border border-slate-100 text-center">
                                <div className="w-16 h-16 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">⏳</div>
                                <h3 className="text-lg font-black text-slate-800 mb-2">Session Expiring</h3>
                                <p className="text-sm font-bold text-slate-500 mb-6">Your session is about to expire due to inactivity.</p>
                                <div className="flex gap-3">
                                    <button onClick={handleLogout} className="flex-1 bg-slate-100 text-slate-600 hover:bg-slate-200 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all">LOGOUT</button>
                                    <button onClick={()=>setShowWarning(false)} className="flex-1 bg-amber-500 text-white hover:bg-amber-600 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all shadow-md">STAY LOGGED IN</button>
                                </div>
                            </motion.div>
                        </div>
                    )}
                </AnimatePresence>
            </>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CampusFlowApp />);
  </script>
</body>
</html>
